[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-text-classification"
version = "0.1.0"
description = "Data-free job text classification examples with local baselines and an optional HTTP adapter"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scikit-learn>=1.3", "joblib>=1.3"]

[project.optional-dependencies]
bert = ["torch>=2.1", "transformers>=4.40"]
dev = ["pytest>=8"]

[project.scripts]
job-text-classification = "job_text_classification.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
job_text_classification = ["examples/*.jsonl"]
