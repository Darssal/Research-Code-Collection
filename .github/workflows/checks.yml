name: Index and publication checks

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Index inventory and canonical links
        run: python tools/check_index.py --remote
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Scan clean documentation and maintenance source
        run: python tools/check_publication.py
      - name: Scan actual Git index blobs
        run: python tools/check_publication.py --staged
      - name: Publication boundary regressions
        run: python -m unittest discover -s tests -v
